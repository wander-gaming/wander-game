name: Tauri Desktop Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  tauri:
    name: Tauri Desktop Build
    runs-on: ${{ matrix.os }}
    continue-on-error: true

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - run: npm ci

      - name: Generate placeholder icons
        shell: bash
        run: |
          mkdir -p src-tauri/icons
          node -e "
          const fs = require('fs');
          const png = Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==', 'base64');
          ['icon.png','32x32.png','128x128.png','128x128@2x.png','Square30x30Logo.png','Square44x44Logo.png','Square71x71Logo.png','Square89x89Logo.png','Square107x107Logo.png','Square142x142Logo.png','Square150x150Logo.png','Square284x284Logo.png','Square310x310Logo.png','StoreLogo.png'].forEach(n => {
            const p = 'src-tauri/icons/' + n;
            if (!fs.existsSync(p)) fs.writeFileSync(p, png);
          });
          if (!fs.existsSync('src-tauri/icons/icon.icns')) fs.writeFileSync('src-tauri/icons/icon.icns', Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==', 'base64'));
          if (!fs.existsSync('src-tauri/icons/icon.ico')) fs.writeFileSync('src-tauri/icons/icon.ico', Buffer.from('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==', 'base64'));
          "

      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: .
          args: --target ${{ matrix.target }} --no-bundle
